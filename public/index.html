<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기숙사 모바일 데이터 속도 측정</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/picnic/7.1.0/picnic.min.css"
  />
  <style>
    /* 모바일 최적화: 1단 세로 레이아웃, 터치하기 쉬운 크기, 확대 없이 읽히는 폰트 */
    body { max-width: 480px; margin: 0 auto; padding: 16px; font-size: 16px; }
    input, select, button { width: 100%; min-height: 44px; font-size: 16px; margin-bottom: 8px; }
    button { min-height: 48px; }
    #indoor-validation-error { color: #c0392b; }
    #measuring-progress { width: 100%; height: 20px; }
    .history-item {
      border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px;
      margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    }
    .history-item .history-time { color: #666; font-size: 12px; }
    #result-summary { border-color: #2980b9; background: #eef6fc; }
  </style>
</head>
<body>
  <main class="container">
    <h1>기숙사 모바일 데이터 속도 측정</h1>

    <section id="step-network">
      <p id="network-status">네트워크 확인 중...</p>
      <button id="btn-network-retry" hidden>다시 시도</button>
    </section>

    <section id="step-location" hidden>
      <p id="location-status">위치 확인 중...</p>
    </section>

    <section id="step-form-indoor" hidden>
      <h2>실내 측정 정보</h2>
      <fieldset>
        <legend>복도인가요?</legend>
        <label><input type="radio" name="is-corridor" id="input-is-corridor-yes" value="yes" /> 예</label>
        <label><input type="radio" name="is-corridor" id="input-is-corridor-no" value="no" checked /> 아니오</label>
      </fieldset>
      <label id="label-floor" hidden>층
        <select id="input-floor">
          <option value="">선택하세요</option>
          <option value="1층">1층</option>
          <option value="2층">2층</option>
          <option value="3층">3층</option>
          <option value="4층">4층</option>
          <option value="5층">5층</option>
        </select>
      </label>
      <label id="label-room">호실
        <input id="input-room" type="text" placeholder="101호" />
      </label>
      <p id="indoor-validation-error" hidden>층 또는 호실을 입력해 주세요.</p>
      <button id="btn-indoor-next">다음</button>
      <button id="btn-indoor-to-outdoor" type="button">사실 기숙사 밖이에요. (직접 변경)</button>
    </section>

    <section id="step-form-outdoor" hidden>
      <h2>외부 측정 정보</h2>
      <p id="outdoor-coords"></p>
      <label>설명(선택) <input id="input-note" type="text" placeholder="예: 정문 앞 버스정류장" /></label>
      <button id="btn-outdoor-next">다음</button>
      <button id="btn-outdoor-to-indoor" type="button">사실 기숙사 안이에요. (직접 변경)</button>
    </section>

    <section id="step-confirm" hidden>
      <h2>측정 시작 전 확인</h2>
      <pre id="confirm-summary"></pre>
      <button id="btn-confirm-start">이 정보로 측정 시작</button>
      <button id="btn-confirm-back">뒤로</button>
    </section>

    <section id="step-measuring" hidden>
      <p id="measuring-status">측정 중...</p>
      <progress id="measuring-progress" value="0" max="100"></progress>
      <button id="btn-measuring-retry" hidden>다시 시도</button>
    </section>

    <section id="step-done" hidden>
      <p>측정 완료. 참여해주셔서 감사합니다.</p>
      <div id="result-summary" class="history-item"></div>
      <h3>이 브라우저의 측정 기록</h3>
      <div id="history-list"></div>
    </section>
  </main>

  <script src="stats-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
